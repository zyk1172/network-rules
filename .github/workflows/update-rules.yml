name: Update upstream network rules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Compile Python modules
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Build client artifacts
        run: python3 scripts/build.py

      - name: Validate artifacts
        run: python3 scripts/validate.py

      - name: Run semantic routing tests
        run: python3 -m unittest discover -s tests -v

      - name: Prepare update summary
        run: python3 scripts/update_summary.py > update-summary.md

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-upstream-rules
          delete-branch: true
          commit-message: "chore(rules): refresh upstream rules"
          title: "chore(rules): refresh upstream rules"
          body-path: update-summary.md
          add-paths: |
            dist/**
            sources/upstreams.lock.json
